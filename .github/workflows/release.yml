# Publishes seamux to npm when the Version Packages PR merges, then tags the
# release and creates its GitHub Release.
#
#   check    Whether main's version needs publishing, with no npm credential
#            and no OIDC identity. It runs on every push to main and reads
#            package.json from the repo, so nothing untrusted reaches a shell.
#   publish  Exists only when `check` says yes, which is right after the
#            Version Packages PR merges. It authenticates with a short-lived
#            token from GitHub OIDC (npm trusted publishing), so there is no
#            stored NPM_TOKEN to leak.
#   tag      Tags the released commit v<version> and creates its GitHub
#            Release from CHANGELOG.md, in its own job so the job that can
#            publish to npm can't also write to this repo.
#
# The gate and the job it gates stay in one file: the gate is what keeps an
# OIDC-capable job from existing at all on an ordinary merge, and split across
# files, a later edit could drop the `needs:` without seeing why it's there.
#
# The untrusted half of a release is release-version.yml, which holds no
# credential. By the time this publishes, the changesets are already merged
# into CHANGELOG.md, so it builds reviewed, merged source only.
#
# No concurrency group, deliberately. The `npm view` guard right before
# `npm publish` makes a duplicate run, or a re-run of one that already
# published, a no-op, which ordering alone would not.
#
# Action refs are pinned to commit SHAs; the trailing comment records the tag.

name: Release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  check:
    name: Check for a new version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - id: check
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$name@$version already published — nothing to do."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Will publish $name@$version."
          fi

  publish:
    name: Publish to npm
    needs: check
    if: needs.check.outputs.publish == 'true'
    # package.json says seamux runs on macOS only, which npm enforces on
    # install.
    runs-on: macos-latest
    # Where npm's trusted publisher for seamux is bound. Give it a required
    # reviewer, so a release waits for a person to approve it rather than
    # shipping on the merge alone.
    environment: npm-production
    permissions:
      contents: read
      id-token: write # OIDC: short-lived npm auth, and build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      # No dependency's install scripts run while the OIDC identity exists.
      - run: npm ci --ignore-scripts
      # Trusted publishing and provenance need npm 11.5.1 or later. Pinned, so
      # a new npm can't change how seamux publishes without a review.
      - run: npm install -g npm@12.0.1 --ignore-scripts
      - run: npm run build

      # --ignore-scripts: the build above already ran, so prepack needn't.
      - name: Publish (skipping a version already on npm)
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published — nothing to do."
          else
            npm publish --provenance --access public --ignore-scripts
          fi

  tag:
    name: Tag and create the GitHub Release
    needs: [check, publish]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag ref and the release, nothing else
    steps:
      # Through the API, so no credential goes in .git. Idempotent: a tag
      # already at this commit is nothing to do, and one at any other commit
      # fails loudly rather than being moved.
      - name: Create the release tag (skipping one that already exists)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${VERSION:-}" ]; then
            echo "::error::No version from the check job; refusing to tag."
            exit 1
          fi
          tag="v${VERSION}"

          # matching-refs returns an empty array when nothing matches, where
          # git/ref/tags/<tag> 404s with a JSON body on stdout. It matches by
          # prefix, hence the exact-ref filter. An annotated tag's sha is the
          # tag object, so deref it before comparing.
          matched=$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${tag}" \
            | jq -r --arg ref "refs/tags/${tag}" \
                '.[] | select(.ref == $ref) | "\(.object.type) \(.object.sha)"')
          existing=""
          if [ -n "$matched" ]; then
            existing=${matched##* }
            if [ "${matched%% *}" = "tag" ]; then
              existing=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${existing}" \
                --jq '.object.sha')
            fi
          fi
          if [ -n "$existing" ]; then
            if [ "$existing" = "$SHA" ]; then
              echo "${tag} already points at ${SHA} — nothing to do."
              exit 0
            fi
            echo "::error::${tag} already exists but points at ${existing}, not ${SHA}. Refusing to move a published tag; resolve this by hand."
            exit 1
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${tag}" \
            -f "sha=${SHA}" >/dev/null
          echo "Tagged ${tag} at ${SHA}."
          echo "### Tagged \`${tag}\`" >> "$GITHUB_STEP_SUMMARY"

      # For CHANGELOG.md, which the release notes come from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # This version's section of CHANGELOG.md, from its heading to the next,
      # read from a file rather than interpolated into the shell. Idempotent
      # like the tag: a release that already exists is nothing to do.
      - name: Create the GitHub Release (skipping one that already exists)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${tag} already exists — nothing to do."
            exit 0
          fi
          notes="$RUNNER_TEMP/notes.md"
          if [ -f CHANGELOG.md ]; then
            awk -v heading="## ${VERSION}" \
              '$0 == heading { on = 1; next } on && /^## / { exit } on' \
              CHANGELOG.md > "$notes"
          fi
          if ! grep -q '[^[:space:]]' "$notes" 2>/dev/null; then
            echo "seamux ${VERSION}." > "$notes"
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
            --title "$tag" --notes-file "$notes" --verify-tag
          echo "### Released \`${tag}\`" >> "$GITHUB_STEP_SUMMARY"
