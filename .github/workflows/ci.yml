# Checks every pull request, and every push to main: it typechecks, runs the
# tests, then builds the compiled board and the
# bundled scripts that the npm package ships, so a change that would break
# `npx seamux` fails here rather than on release.
#
# On macOS, because package.json says seamux runs there only, and npm refuses
# to install it anywhere else (EBADPLATFORM), even for a typecheck.
#
# Taskless isn't wired in yet: the repo has no rules, and a check with none
# is always green. Add it (`npx @taskless/cli agent ci`) with the first rule.
#
# Action refs are pinned to commit SHAs; the trailing comment records the tag.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request supersedes the run still checking the last
# one. Runs on main each finish, so every commit there gets its result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Typecheck and build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # No dependency's install scripts run: nothing here needs them.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      # tests/, against a fake cmux (tests/fake-cmux.ts): nothing here needs
      # cmux or Claude Code installed. tests-cmux/, the contract against a
      # real cmux, runs locally only (npm run test:cmux).
      - run: npm test
      - run: npm run build
