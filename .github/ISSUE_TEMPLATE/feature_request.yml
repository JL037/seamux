name: Feature request
description: Something seamux should do, or do differently.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Before you write it up, read [what makes a proposal fit](https://github.com/thecodedrift/seamux/blob/main/CONTRIBUTING.md#proposing-a-change) seamux.

  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The situation, and what gets in the way today. A problem described well is worth more than a solution.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you'd like seamux to handle it, if you have an idea. Say if it needs something cmux doesn't provide today, new stored state, or a change to how the board is laid out.

  - type: dropdown
    id: agent
    attributes:
      label: Agent
      description: Which agent it's about, if either.
      options:
        - Claude Code
        - Codex
        - Both
        - Another agent
        - Neither
